name: Deploy to Tour de Cloud

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Upload to Tour de Cloud
        uses: studentscangrow/upload-app@v27
        with:
          tdc_token: ${{ secrets.TDC_TOKEN }}
