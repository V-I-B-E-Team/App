# $schema: https://tourde.cloud/api/v2/schema

exposedPort: 80

containers:
  - name: web
    image: registry.tourde.cloud/v_i_b_e/web
    port: 3000
    env:
      BACKEND_URL: http://localhost:8000

  - name: server
    image: registry.tourde.cloud/v_i_b_e/server
    port: 8000

  - name: caddy
    image: registry.tourde.cloud/<team-slug>/caddy
    port: 80

build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile

  - name: server
    context: ./backend
    dockerfile: ./backend/Dockerfile

  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
