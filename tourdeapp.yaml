# $schema: https://tourde.cloud/api/v2/schema

exposedPort: 80

containers:
  - name: web
    image: registry.tourde.cloud/v_i_b_e/web
    port: 3000
    env:
      BACKEND_URL: http://localhost:8000

  - name: server
    image: registry.tourde.cloud/v_i_b_e/server
    port: 8000
    env:
      MONGODB_URI: mongodb://root:procMIkradesHESLOzmrde@localhost:27017/?authSource=admin

  - name: database
    image: mongo
    tag: "4.4-focal"
    port: 27017
    env:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: procMIkradesHESLOzmrde

  - name: caddy
    image: registry.tourde.cloud/v_i_b_e/caddy
    port: 80
    env:
      BACKEND_UPSTREAM: http://localhost:8000
      WEB_UPSTREAM: http://localhost:3000

build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile

  - name: server
    context: ./backend
    dockerfile: ./backend/Dockerfile

  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
