# $schema: https://tourde.cloud/api/v2/schema

exposedPort: 80

containers:
  - name: web
    image: registry.tourde.cloud/v_i_b_e/web
    port: 3000
    env:
      BACKEND_URL: http://localhost:8000

  - name: server
    image: registry.tourde.cloud/v_i_b_e/server
    port: 8000
    env:
      DATABASE_URL: mysql://app:app@localhost:3306/app

  - name: mysql
    image: mysql
    tag: "8.4"
    port: 3306
    env:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root

  - name: caddy
    image: registry.tourde.cloud/v_i_b_e/caddy
    port: 80

build:
  - name: web
    context: ./frontend
    dockerfile: ./frontend/Dockerfile

  - name: server
    context: ./backend
    dockerfile: ./backend/Dockerfile

  - name: caddy
    context: ./caddy
    dockerfile: ./caddy/Dockerfile
